<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Game Vault — Shared Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cabinet.css">
<style>
  /* Two tabs on the phone tab bar */
  @media (max-width: 760px) {
    .nav-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  [hidden] { display: none !important; }
</style>
<meta name="theme-color" content="#0a0818">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-512.png">
</head>
<body>
<!--
  Read-only share page. It shows the collection and has no way to save changes.
  Data comes from FEED_URL, a read-only feed that returns only shareable fields.
-->
<div class="cabinet-frame">
<nav aria-label="Primary navigation">
  <div class="brand-zone">
    <div class="nav-brand">
      <img class="brand-mark" src="assets/logo-192.png" alt="">
      <span class="brand-copy">
        <span class="brand-title">Game Vault</span>
        <span class="brand-sub">Board game arcade</span>
      </span>
    </div>
  </div>
  <div class="nav-tabs" role="tablist" aria-label="Sections">
    <button type="button" role="tab" class="nav-tab active" data-tab="collection" aria-selected="true" aria-controls="tab-collection">
      <svg class="ui-icon" aria-hidden="true"><use href="assets/ui-icons.svg#collection"></use></svg>
      <span>Collection</span>
    </button>
    <button type="button" role="tab" class="nav-tab" data-tab="favorites" aria-selected="false" aria-controls="tab-favorites">
      <svg class="ui-icon" aria-hidden="true"><use href="assets/ui-icons.svg#stats"></use></svg>
      <span>Favorites</span>
    </button>
  </div>
  <div class="cabinet-id" aria-hidden="true">
    <img class="cabinet-id-dino" src="assets/dinos/trex.png" alt="">
    <span class="cabinet-id-copy"><strong>FREE PLAY</strong><br>Good games. Great nights.</span>
  </div>
</nav>

<main class="app-shell">
<div class="share-banner" id="share-banner" hidden>
  <svg class="ui-icon" aria-hidden="true"><use href="assets/ui-icons.svg#eye"></use></svg>
  <span id="share-banner-text"></span>
</div>

<!-- COLLECTION -->
<div class="section active" id="tab-collection">
  <div class="collection-hero">
    <div class="collection-title-block">
      <div class="eyebrow">Stage 1 · Collection</div>
      <div class="page-title" id="vault-title">The game vault</div>
      <div class="page-sub" id="col-sub">Loading...</div>
    </div>
    <div class="stats-row" id="col-stats"></div>
  </div>
  <div class="filters-bar">
    <label class="search-control" for="search-input">
      <svg class="ui-icon" aria-hidden="true"><use href="assets/ui-icons.svg#search"></use></svg>
      <input class="fsearch" type="text" id="search-input" placeholder="Search games">
    </label>
    <div class="fgrp" id="collection-shelf-group"></div>
    <details class="status-menu">
      <summary>
        <span>Filters</span>
        <svg class="ui-icon" aria-hidden="true"><use href="assets/ui-icons.svg#chevron"></use></svg>
      </summary>
      <div class="status-panel">
        <div class="fgrp status-group" data-filter="status">
          <span class="fgrp-lbl">Played</span>
          <button class="fbtn active" data-value="">All</button>
          <button class="fbtn" data-value="played">Played</button>
          <button class="fbtn" data-value="unplayed">Unplayed</button>
        </div>
        <div class="fgrp type-group" data-filter="type">
          <span class="fgrp-lbl">Type</span>
          <button class="fbtn active" data-value="">Include expansions</button>
          <button class="fbtn" data-value="base">Base games only</button>
        </div>
        <div class="fgrp kids-group" data-filter="kids">
          <span class="fgrp-lbl">Kids games</span>
          <button class="fbtn active" data-value="hide">No kids games</button>
          <button class="fbtn" data-value="show">Include kids</button>
        </div>
      </div>
    </details>
  </div>
  <div class="game-grid" id="game-grid"></div>
  <div class="bgg-credit">
    <a href="https://boardgamegeek.com" target="_blank" rel="noopener noreferrer">
      <img src="assets/powered-by-bgg-rgb.svg" alt="Powered by BoardGameGeek">
    </a>
  </div>
</div>

<!-- FAVORITES -->
<div class="section" id="tab-favorites">
  <header class="section-header">
    <div>
      <div class="eyebrow">Stage 2 · High scores</div>
      <div class="page-title">Favorites</div>
      <div class="page-sub">The top-rated games in the vault.</div>
    </div>
  </header>
  <div class="favorites-grid" id="player-favorites"></div>
</div>
</main>

<div class="cabinet-footer">
  <span>Game Vault · View only</span>
  <span>Collect · Play · Remember · © 198X</span>
</div>
</div>

<!-- DETAIL DRAWER -->
<div class="moverlay" id="moverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-name">
    <button class="mclose" id="m-close" aria-label="Close game details">×</button>
    <div class="modal-game-head">
      <div class="modal-cover" id="m-cover"></div>
      <div class="modal-game-copy">
        <div class="modal-kicker">Game details</div>
        <div class="mtitle" id="m-name"></div>
        <div class="mcat" id="m-cat"></div>
      </div>
    </div>
    <div class="mgrid" id="m-grid"></div>
    <div id="m-link" style="margin-top:28px;"></div>
  </div>
</div>

<script src="bgg-images.js"></script>
<script>
(() => {
  'use strict';

  // Paste the web app URL from google-apps-script/ShareFeed.gs here (ends in /exec).
  const FEED_URL = 'https://script.google.com/macros/s/AKfycbxh_PbyY5U59e0-ngRYSW3FFVTRUJ2UWetuI9XfSEle5_00GrrIFvyKRr0qru6q2-IrLA/exec';

  const CACHE_KEY = 'gv-share-feed';
  const SHELF_ORDER = ['2-Player', 'Adult', 'Family', 'Party', 'Kids', 'Solo'];
  const filters = {shelf: [], status: '', type: '', kids: 'hide'};
  let GAMES = [];
  let P1 = {name: 'Player 1'};
  let P2 = {name: 'Player 2'};
  const $ = id => document.getElementById(id);

  const esc = value => String(value ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const safeUrl = value => /^https:\/\//i.test(value || '') ? value : '';
  const rating = value => { const n = parseFloat(value); return Number.isFinite(n) ? n : null; };
  const splitShelves = value => String(value || '').split(/[;,/]|\s+&\s+|\s+and\s+|\s+\+\s+/gi).map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const onShelf = (game, shelf) => splitShelves(game.s).some(s => s.toLowerCase() === shelf.toLowerCase());

  // Games in view before search and shelf filters: kids' games are left out unless asked for.
  const inScope = () => filters.kids === 'hide' ? GAMES.filter(g => !onShelf(g, 'Kids')) : GAMES;

  function shelves() {
    const seen = new Map();
    inScope().flatMap(g => splitShelves(g.s)).forEach(s => { if (!seen.has(s.toLowerCase())) seen.set(s.toLowerCase(), s); });
    const ordered = SHELF_ORDER.filter(s => seen.has(s.toLowerCase())).map(s => seen.get(s.toLowerCase()));
    const rest = [...seen.values()].filter(s => !ordered.includes(s)).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
    return [...ordered, ...rest];
  }

  function coverMarkup(game, lazy) {
    const large = safeUrl(game.img) || safeUrl(window.BGG_IMAGE_MAP?.[game.id]);
    const thumb = safeUrl(game.thumb);
    const src = large || thumb;
    if (!src) return '';
    return `<img src="${esc(src)}" data-fallback="${esc(large ? thumb : '')}" alt="${esc(game.n)} cover"${lazy ? ' loading="lazy" decoding="async"' : ''} referrerpolicy="no-referrer">`;
  }

  // Cover images load from BoardGameGeek's image host; size the frame once they arrive.
  document.addEventListener('load', event => {
    const img = event.target;
    if (!(img instanceof HTMLImageElement)) return;
    const frame = img.closest('.game-cover,.modal-cover');
    if (!frame || !img.naturalWidth) return;
    const ratio = img.naturalWidth / img.naturalHeight;
    frame.classList.remove('cover-landscape', 'cover-square', 'cover-portrait');
    frame.classList.add(ratio > 1.18 ? 'cover-landscape' : ratio > .84 ? 'cover-square' : 'cover-portrait');
    frame.style.backgroundImage = `linear-gradient(rgba(10,8,24,.55),rgba(10,8,24,.78)),url("${String(img.currentSrc || img.src).replace(/["\\]/g, '')}")`;
  }, true);

  document.addEventListener('error', event => {
    const img = event.target;
    if (!(img instanceof HTMLImageElement) || !img.closest('.game-cover,.modal-cover')) return;
    const fallback = img.dataset.fallback;
    if (fallback && img.src !== fallback) { img.dataset.fallback = ''; img.src = fallback; return; }
    img.style.display = 'none';
  }, true);

  // ── Collection ──
  function filteredGames() {
    const q = $('search-input').value.trim().toLowerCase();
    return inScope().filter(g => {
      if (q && !g.n.toLowerCase().includes(q) && !String(g.cat).toLowerCase().includes(q)) return false;
      if (filters.shelf.length && !filters.shelf.some(s => onShelf(g, s))) return false;
      if (filters.status === 'played' && !g.played) return false;
      if (filters.status === 'unplayed' && g.played) return false;
      if (filters.type === 'base' && g.exp) return false;
      return true;
    });
  }

  function ratingChips(game) {
    const a = rating(game.r1), b = rating(game.r2);
    if (a === null && b === null) return '';
    return `<div class="rating-strip">
      ${a !== null ? `<span class="rating-chip john"><span>${esc(P1.name)}</span><strong>${a}</strong></span>` : ''}
      ${b !== null ? `<span class="rating-chip elizabeth"><span>${esc(P2.name)}</span><strong>${b}</strong></span>` : ''}
    </div>`;
  }

  function renderCollection() {
    const list = shelves();
    filters.shelf = filters.shelf.filter(s => list.includes(s));
    $('collection-shelf-group').innerHTML = `<span class="fgrp-lbl">Shelf</span>
      <button class="fbtn ${filters.shelf.length ? '' : 'active'}" data-shelf=""><span>All games</span></button>
      ${list.map(s => `<button class="fbtn ${filters.shelf.includes(s) ? 'active' : ''}" data-shelf="${esc(s)}"><span>${esc(s)}</span></button>`).join('')}`;
    const shown = filteredGames();
    const scope = inScope();
    const played = scope.filter(g => g.played).length;
    const pct = scope.length ? Math.round(played / scope.length * 100) : 0;
    $('col-sub').textContent = `${shown.length} of ${scope.length} games`;
    $('col-stats').innerHTML = `
      <div class="stat-card stat-progress">
        <div class="stat-progress-head"><div><div class="stat-label">Collection played</div><div class="stat-num">${pct}<span class="stat-suffix">%</span></div></div><span>${played} of ${scope.length}</span></div>
        <div class="collection-meter" aria-label="${pct} percent of collection played"><span style="width:${pct}%"></span></div>
      </div>
      <div class="stat-card"><div class="stat-num">${scope.filter(g => !g.exp).length}</div><div class="stat-label">Base games</div></div>
      <div class="stat-card"><div class="stat-num">${scope.filter(g => g.exp).length}</div><div class="stat-label">Expansions</div></div>
      <div class="stat-card"><div class="stat-num">${scope.length - played}</div><div class="stat-label">Unplayed</div></div>
      <div class="stat-card"><div class="stat-num">${list.length}</div><div class="stat-label">Shelves</div></div>`;
    const grid = $('game-grid');
    if (!shown.length) { grid.innerHTML = '<div class="empty">No games match your filters.</div>'; return; }
    grid.innerHTML = shown.map(g => {
      const cover = coverMarkup(g, true);
      return `<div class="game-card ${g.played ? 'played-card' : ''}" data-game="${esc(g.n)}" role="button" tabindex="0">
        ${cover ? `<div class="game-cover">${cover}</div>` : '<div class="game-cover game-cover-empty"><span>No cover</span></div>'}
        <div class="game-card-body">
          <div class="game-card-title-row"><div class="gname">${esc(g.n)}</div></div>
          <div class="game-card-category">${esc(g.cat)}</div>
          <div class="game-card-metrics">
            <span class="card-metric metric-score"><strong>BGG ${esc(g.bg || '—')}</strong></span>
            ${g.plBGG ? `<span class="card-metric metric-players">${esc(g.plBGG)} players</span>` : ''}
            ${g.ba ? `<span class="card-metric metric-best">Best at ${esc(g.ba)}</span>` : ''}
          </div>
          <div class="game-card-footer">${ratingChips(g)}<div class="play-count">${g.played ? 'Played' : 'Not played yet'}</div></div>
        </div>
      </div>`;
    }).join('');
  }

  // ── Favorites ──
  function renderFavorites() {
    const top = key => GAMES.filter(g => !g.exp && rating(g[key]) !== null).sort((a, b) => rating(b[key]) - rating(a[key]) || a.n.localeCompare(b.n)).slice(0, 5);
    const card = (player, key, cls) => {
      const games = top(key);
      return `<div class="favorites-card ${cls}"><div class="favorites-title">${esc(player.name)}'s Top Games</div>${games.length
        ? games.map((g, i) => `<div class="favorite-row" data-game="${esc(g.n)}" role="button" tabindex="0"><span class="favorite-rank">${i + 1}</span><span class="favorite-name">${esc(g.n)}</span><span class="favorite-score">${rating(g[key])}</span></div>`).join('')
        : '<div class="favorites-empty">No ratings yet.</div>'}</div>`;
    };
    $('player-favorites').innerHTML = card(P1, 'r1', '') + card(P2, 'r2', 'elizabeth');
    const anyRatings = GAMES.some(g => rating(g.r1) !== null || rating(g.r2) !== null);
    document.querySelector('[data-tab="favorites"]').hidden = !anyRatings;
    if (!anyRatings) showTab('collection');
  }

  // ── Detail drawer ──
  function openModal(name) {
    const g = GAMES.find(x => x.n === name);
    if (!g) return;
    $('m-cover').removeAttribute('style');
    $('m-cover').className = 'modal-cover';
    $('m-cover').innerHTML = coverMarkup(g, false) || '<span>No cover</span>';
    $('m-name').textContent = g.n;
    $('m-cat').textContent = g.cat;
    const field = (label, value) => `<div class="mfield"><label>${esc(label)}</label><div class="val">${esc(value || '—')}</div></div>`;
    $('m-grid').innerHTML = [
      field('Shelf', g.s), field('BGG Score', g.bg), field('Players', g.pl),
      field('Best At', g.ba), field('Solo Option', g.so), field('Type', g.exp ? 'Expansion' : 'Base Game'),
      field(`${P1.name} Rating`, g.r1), field(`${P2.name} Rating`, g.r2), field('Status', g.played ? 'Played' : 'Not played yet')
    ].join('');
    const url = safeUrl(g.url);
    $('m-link').innerHTML = url ? `<a class="btn btn-outline btn-sm" href="${esc(url)}" target="_blank" rel="noopener noreferrer">View on BoardGameGeek</a>` : '';
    $('moverlay').classList.add('open');
    $('m-close').focus();
  }
  function closeModal() { $('moverlay').classList.remove('open'); }

  // ── Data ──
  function banner(html) {
    $('share-banner').hidden = !html;
    $('share-banner-text').innerHTML = html || '';
  }

  function validFeed(data) {
    return data && Array.isArray(data.games) && data.games.every(g => g && typeof g.n === 'string');
  }

  function apply(data) {
    GAMES = data.games.filter(g => g.n.trim());
    P1 = {name: String(data.players?.[0]?.name || 'Player 1')};
    P2 = {name: String(data.players?.[1]?.name || 'Player 2')};
    $('vault-title').textContent = data.players?.length === 2 ? `${P1.name} & ${P2.name}'s game vault` : 'The game vault';
    renderCollection();
    renderFavorites();
  }

  function readCache() {
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      return validFeed(cached) ? cached : null;
    } catch (error) { return null; }
  }

  async function load() {
    if (!FEED_URL) {
      $('col-sub').textContent = 'The collection is not available yet.';
      return;
    }
    // Show the last copy this browser saw right away, then replace it with the live sheet.
    const cached = readCache();
    if (cached) apply(cached);
    try {
      const response = await fetch(FEED_URL, {cache: 'no-store', redirect: 'follow'});
      if (!response.ok) throw new Error(`Feed returned ${response.status}`);
      const data = await response.json();
      if (!validFeed(data)) throw new Error('Feed returned an unexpected shape');
      apply(data);
      banner('');
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({players: data.players, games: data.games})); } catch (error) {}
    } catch (error) {
      console.error('Share feed failed:', error);
      if (cached) banner('Could not reach the live collection. Showing the last copy this browser loaded.');
      else $('col-sub').textContent = 'The collection could not be loaded. Try again in a moment.';
    }
  }

  // ── Wiring ──
  function showTab(id) {
    document.querySelectorAll('.nav-tab').forEach(tab => {
      const on = tab.dataset.tab === id;
      tab.classList.toggle('active', on);
      tab.setAttribute('aria-selected', String(on));
    });
    document.querySelectorAll('.section').forEach(section => section.classList.toggle('active', section.id === 'tab-' + id));
  }

  const toggle = (list, value) => list.includes(value) ? list.filter(v => v !== value) : [...list, value];

  document.addEventListener('click', event => {
    const target = event.target;
    const tab = target.closest('.nav-tab');
    if (tab) { showTab(tab.dataset.tab); window.scrollTo(0, 0); return; }
    const opener = target.closest('[data-game]');
    if (opener) return openModal(opener.dataset.game);
    if (target === $('moverlay') || target.closest('#m-close')) return closeModal();
    const button = target.closest('.fbtn');
    if (!button) return;
    if (button.closest('#collection-shelf-group')) {
      filters.shelf = button.dataset.shelf ? toggle(filters.shelf, button.dataset.shelf) : [];
      return renderCollection();
    }
    const group = button.closest('[data-filter]');
    if (!group) return;
    group.querySelectorAll('.fbtn').forEach(b => b.classList.toggle('active', b === button));
    filters[group.dataset.filter] = button.dataset.value;
    renderCollection();
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') return closeModal();
    const opener = event.target.closest?.('[data-game]');
    if (opener && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); openModal(opener.dataset.game); }
  });

  $('search-input').addEventListener('input', renderCollection);
  load();
})();
</script>
</body>
</html>
